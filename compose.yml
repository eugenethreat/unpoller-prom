version: "3"

services:
  unpoller:
    hostname: "unpoller"
    image: ghcr.io/unpoller/unpoller:latest
    container_name: unpoller
    volumes:
      - ./unpoller.conf:/etc/unpoller/up.conf
    ports:
      - 9130:9130
      - 37288:37288
    environment:
      - UP_UNIFI_DEFAULT_USER=${UP_UNIFI_DEFAULT_USER}
      - UP_UNIFI_DEFAULT_PASS=${UP_UNIFI_DEFAULT_PASS}
      - UP_UNIFI_DEFAULT_URL=${UP_UNIFI_DEFAULT_URL}

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    ports:
      - 8428:8428
    volumes:
      - victoria-metrics-data:/victoria-metrics-data
      - ./prometheus.yml:/prometheus.yml
    command:
      - -promscrape.config=/prometheus.yml
      - -storageDataPath=/victoria-metrics-data

  grafana:
    image: grafana/grafana
    container_name: pcw-grafana
    volumes:
      # - ./grafana.ini:/etc/grafana/grafana.ini
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    ports:
      - 3000:3000
    environment:
      - GF_PLUGINS_PREINSTALL=${GF_PLUGINS_PREINSTALL}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}

    depends_on:
      - victoriametrics

  loki:
    image: grafana/loki:latest
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml

  alloy:
    image: grafana/alloy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./alloy-config.alloy:/etc/alloy/alloy-config.alloy
    command:
      - run
      - /etc/alloy/alloy-config.alloy
    depends_on:
      - loki

volumes:
  victoria-metrics-data:
  grafana-data:
